<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STY AI Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a2a;
      background: #141414;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 18px; font-weight: 600; color: #ffffff; }
    header span { font-size: 13px; color: #888; }

    .mode-bar {
      padding: 10px 24px;
      background: #141414;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active { background: #1a6cf5; border-color: #1a6cf5; color: #fff; }
    .mode-btn:hover:not(.active) { border-color: #555; color: #ccc; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message { max-width: 780px; line-height: 1.6; }

    .message.user {
      align-self: flex-end;
      background: #1a6cf5;
      color: #fff;
      padding: 12px 16px;
      border-radius: 16px 16px 4px 16px;
      font-size: 14px;
    }

    .message.agent {
      align-self: flex-start;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      padding: 16px 20px;
      border-radius: 4px 16px 16px 16px;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.agent.loading { color: #666; font-style: italic; }

    .input-area {
      padding: 16px 24px;
      background: #141414;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    #prompt {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e8e8e8;
      font-size: 14px;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
    }

    #prompt:focus { border-color: #1a6cf5; }

    #sendBtn {
      background: #1a6cf5;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      height: 48px;
    }

    #sendBtn:hover { background: #1558cc; }
    #sendBtn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #555;
      text-align: center;
    }

    .empty-state h2 { font-size: 22px; color: #888; }
    .empty-state p { font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h1>STY AI Agent</h1>
  <span>Finance · Data · Reporting</span>
</header>

<div class="mode-bar">
  <button class="mode-btn active" data-mode="general">General</button>
  <button class="mode-btn" data-mode="finance">Finance</button>
  <button class="mode-btn" data-mode="data">Data</button>
  <button class="mode-btn" data-mode="report">Report</button>
</div>

<div id="chat">
  <div class="empty-state">
    <h2>What do you need help with?</h2>
    <p>Select a mode above, then type your question below.</p>
  </div>
</div>

<div class="input-area">
  <textarea id="prompt" placeholder="Ask anything... (Shift+Enter for new line)" rows="1"></textarea>
  <button id="sendBtn">Send</button>
</div>

<script>
  let currentMode = 'general';
  const chat = document.getElementById('chat');
  const promptEl = document.getElementById('prompt');
  const sendBtn = document.getElementById('sendBtn');

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
    });
  });

  promptEl.addEventListener('input', () => {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
  });

  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function clearEmptyState() {
    const empty = chat.querySelector('.empty-state');
    if (empty) empty.remove();
  }

  function addMessage(text, type) {
    clearEmptyState();
    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const prompt = promptEl.value.trim();
    if (!prompt) return;

    promptEl.value = '';
    promptEl.style.height = 'auto';
    sendBtn.disabled = true;
    sendBtn.textContent = '...';

    addMessage(prompt, 'user');
    const loadingMsg = addMessage('Thinking...', 'agent loading');

    try {
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: currentMode, prompt }),
      });

      const data = await res.json();
      loadingMsg.classList.remove('loading');
      loadingMsg.textContent = data.response || data.error || 'No response received.';
    } catch (err) {
      loadingMsg.classList.remove('loading');
      loadingMsg.textContent = 'Error: Could not reach the server.';
    }

    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
